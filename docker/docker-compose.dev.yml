# 开发用：仅启动 PostgreSQL（Windows 本机开发时使用）
#   docker compose --env-file .env -f docker/docker-compose.dev.yml up -d
# 注意：compose v2 的项目目录取 compose 文件所在目录（docker/），不会自动读仓库
# 根目录的 .env，所以必须显式加 --env-file .env（在仓库根目录执行）。
# 后端与前端在本机用 node 直接跑，详见 README。
#
# 注意：显式指定项目名与卷名，避免与 E:\projects 下其他项目的 docker/ 目录
# （compose 默认项目名取父目录名 "docker"）互相顶掉容器。
name: taskboard

services:
  db:
    image: ${IMAGE_POSTGRES:-postgres:16-alpine}
    container_name: taskboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-taskboard}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-taskboard}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  # 固定卷名，不随 compose 项目名变化，避免重建时数据"消失"
  pg_data:
    name: taskboard_pg_data
